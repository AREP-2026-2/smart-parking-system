server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Permite que el dashboard siga funcionando si se detiene un contenedor durante el demo.
    resolver 127.0.0.11 valid=5s;

    location /api/ {
        set $allocation http://allocation:8080;
        proxy_pass $allocation;
        proxy_read_timeout 120s;
    }

    location /ml/ {
        set $prediction prediction:8000;
        rewrite ^/ml/(.*)$ /$1 break;
        proxy_pass http://$prediction;
    }

    location = /nginx.conf {
        return 404;
    }
}
